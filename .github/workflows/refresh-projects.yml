name: Refresh Projects Data

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate projects.json
        run: node .github/scripts/refresh-projects.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit and push if changed
        shell: bash
        run: |
          if ! git diff --quiet -- assets/projects.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/projects.json
            git commit -m "chore: refresh live projects data from GitHub"
            git push
          else
            echo "No changes to assets/projects.json"
          fi
